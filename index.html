<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Statistics Notes Flashcard Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bubbly cartoon-ish font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#fdf7e3;
      --bg-soft:#f9e8b9;
      --card:#fff7c2;
      --card-top:#ffe9a3;
      --accent:#f59e0b;
      --accent-soft:#fbbf24;
      --accent-dark:#8b5a2b;
      --text:#5b3b21;
      --muted:#b28c5a;
      --shadow:0 20px 40px rgba(177, 128, 40, 0.35);
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:"Baloo 2", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top, #ffe9b0 0, #fdf7e3 40%, #f7e3ad 90%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      padding:1.5rem;
    }

    .app{
      max-width:950px;
      width:100%;
    }

    .title{
      text-align:center;
      margin-bottom:0.5rem;
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      font-size:0.95rem;
      color:var(--accent-dark);
    }

    .heading{
      text-align:center;
      font-size:2rem;
      font-weight:800;
      margin-bottom:0.25rem;
      color:var(--accent-dark);
      text-shadow:0 3px 0 rgba(255,255,255,0.7);
    }

    .subtitle{
      text-align:center;
      font-size:0.98rem;
      color:var(--muted);
      margin-bottom:1.3rem;
    }

    .subtitle strong{
      color:var(--accent-dark);
    }

    .card-wrapper{
      display:flex;
      justify-content:center;
      margin-bottom:1rem;
    }

    .card{
      width:100%;
      max-width:540px;
      height:340px;
      cursor:pointer;
      border-radius:2rem;
      padding:3px;
      background:linear-gradient(135deg, #ffe6a3, #fbbf24);
      box-shadow:var(--shadow);
      transition:transform 0.18s ease, box-shadow 0.18s ease;
      overflow:hidden;
    }

    .card:hover{
      transform:translateY(-4px) scale(1.02);
      box-shadow:0 26px 45px rgba(177, 128, 40, 0.45);
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      border-radius:1.9rem;
      background:radial-gradient(circle at top, var(--card-top), var(--card));
      overflow:hidden;
      padding:1.8rem 2rem;
    }

    .card-face{
      position:absolute;
      inset:0;
      padding:1.8rem 2rem;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:opacity 0.3s ease, transform 0.3s ease;
    }

    .card-front{
      opacity:1;
      transform:translateX(0);
      z-index:2;
    }

    .card-back{
      opacity:0;
      transform:translateX(12px);
      z-index:1;
    }

    .card.show-answer .card-front{
      opacity:0;
      transform:translateX(-12px);
      z-index:1;
      pointer-events:none;
    }

    .card.show-answer .card-back{
      opacity:1;
      transform:translateX(0);
      z-index:2;
      pointer-events:auto;
    }

    .card-face::before{
      content:"";
      position:absolute;
      width:120px;
      height:120px;
      border-radius:999px;
      background:rgba(255,255,255,0.7);
      opacity:0.4;
      filter:blur(4px);
      top:-40px;
      right:-30px;
      pointer-events:none;
    }

    .card-face::after{
      content:"";
      position:absolute;
      width:80px;
      height:80px;
      border-radius:999px;
      background:rgba(255,255,255,0.6);
      opacity:0.5;
      filter:blur(2px);
      bottom:-30px;
      left:-20px;
      pointer-events:none;
    }

    .card-content{
      position:relative;
      z-index:3;
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .badge{
      position:relative;
      display:inline-flex;
      align-items:center;
      gap:0.4rem;
      font-size:0.8rem;
      text-transform:uppercase;
      letter-spacing:0.15em;
      color:#fff;
      background:linear-gradient(135deg, var(--accent), var(--accent-soft));
      border-radius:999px;
      padding:0.25rem 0.85rem 0.25rem 0.4rem;
      box-shadow:0 6px 14px rgba(245, 158, 11, 0.35);
      z-index:4;
    }

    .badge-dot{
      width:0.7rem;
      height:0.7rem;
      border-radius:999px;
      background:#fff;
      box-shadow:0 0 0 4px rgba(255,255,255,0.7);
    }

    .question-text{
      font-size:1.6rem;
      font-weight:700;
      line-height:1.3;
      margin-top:0.6rem;
    }

    .flip-hint{
      font-size:0.95rem;
      color:var(--muted);
      margin-top:0.6rem;
      display:flex;
      align-items:center;
      gap:0.35rem;
    }

    .flip-hint::before{
      content:"🔄";
      font-size:1.1rem;
    }

    .ordinal{
      font-size:0.95rem;
      color:var(--muted);
      text-align:right;
    }

    .back-top{
      display:flex;
      justify-content:space-between;
      gap:0.75rem;
      align-items:flex-start;
      margin-top:0.4rem;
    }

    .term-main{
      font-size:1.45rem;
      font-weight:800;
      color:var(--accent-dark);
    }

    .category-pill{
      font-size:0.8rem;
      padding:0.3rem 0.85rem;
      border-radius:999px;
      border:2px dashed rgba(139, 90, 43, 0.5);
      color:var(--accent-dark);
      background:rgba(255,255,255,0.7);
      white-space:nowrap;
    }

    .definition{
      margin-top:1rem;
      font-size:1.02rem;
      line-height:1.6;
    }

    .example{
      margin-top:0.8rem;
      font-size:0.95rem;
      line-height:1.5;
      color:var(--accent-dark);
    }

    .foot-note{
      font-size:0.8rem;
      color:var(--muted);
      margin-top:0.6rem;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      gap:0.7rem;
      align-items:center;
      justify-content:space-between;
      margin-top:0.8rem;
    }

    .left-buttons,
    .right-buttons{
      display:flex;
      flex-wrap:wrap;
      gap:0.45rem;
      align-items:center;
    }

    button{
      border:none;
      border-radius:999px;
      padding:0.55rem 1.1rem;
      font-size:0.9rem;
      font-weight:600;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:0.35rem;
      background:#fff2c4;
      color:var(--accent-dark);
      border:2px solid #f5d08a;
      box-shadow:0 6px 0 #f0b754;
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        background 0.12s ease;
    }

    button.primary{
      background:linear-gradient(135deg, #ffd65a, #ffb347);
      border-color:#f59e0b;
      color:#7b4a1b;
      box-shadow:0 7px 0 #e29a25;
    }

    button:hover{
      transform:translateY(-1px);
    }

    button:active{
      transform:translateY(3px);
      box-shadow:0 3px 0 rgba(0,0,0,0.15);
    }

    .counter{
      font-size:0.85rem;
      color:var(--accent-dark);
      padding:0.3rem 0.8rem;
      border-radius:999px;
      background:#fff3cc;
      border:1px solid #f2cf87;
    }

    .mode-label{
      font-size:0.8rem;
      color:var(--muted);
    }

    .mode-label span{
      color:var(--accent-dark);
      font-weight:700;
    }

    @media (max-width:640px){

      .heading{
        font-size:1.7rem;
      }

      .card{
        height:350px;
      }

      .card-inner{
        padding:1.4rem 1.35rem;
      }

      .card-face{
        padding:1.4rem 1.35rem;
      }

      .question-text{
        font-size:1.35rem;
      }

      .definition{
        font-size:0.95rem;
      }

      .example{
        font-size:0.9rem;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="title">Statistics Flashcards</div>

    <div class="heading">
      Statistics Notes Quiz
    </div>

    <p class="subtitle">
      Front: <strong>Question</strong> &mdash;
      Back: definition and memory trick.
      Tap / click the big card to reveal the answer 💭
    </p>

    <div class="card-wrapper">

      <div class="card" id="card">

        <div class="card-inner">

          <!-- FRONT -->
          <div class="card-face card-front">

            <div class="card-content">

              <div>

                <div class="badge">
                  <span class="badge-dot"></span>
                  Question
                </div>

                <p class="question-text" id="question-text"></p>

                <p class="flip-hint">
                  Tap to reveal the answer!
                </p>

              </div>

              <div>
                <p class="ordinal" id="ordinal-label"></p>
              </div>

            </div>

          </div>


          <!-- BACK -->
          <div class="card-face card-back">

            <div class="card-content">

              <div>

                <div class="badge">
                  <span class="badge-dot"></span>
                  Answer
                </div>

                <div class="back-top">

                  <div>
                    <p class="term-main" id="term-name"></p>
                  </div>

                  <div class="category-pill" id="term-category"></div>

                </div>

                <p class="definition" id="term-definition"></p>

                <p class="example" id="term-example"></p>

                <p class="foot-note">
                  Tap again to go back to the question 🔁
                </p>

              </div>

            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- CONTROLS -->
    <div class="controls">

      <div class="left-buttons">

        <button id="prev-btn">
          ⬅ Previous
        </button>

        <button id="next-btn" class="primary">
          Next ➜
        </button>

      </div>

      <div class="right-buttons">

        <span class="counter" id="counter"></span>

        <button id="shuffle-btn">
          🔀 Shuffle
        </button>

        <span class="mode-label">
          Mode: <span>Statistics</span>
        </span>

      </div>

    </div>

  </div>


  <script>

    /*
      STATISTICS FLASHCARDS
      Corrected AP Statistics definitions
    */

    const statistics = [

      // =========================
      // BASICS
      // =========================

      {
        term: "Population",
        category: "Basics",
        question: "What is a Population?",
        definition: "The entire group you want to study.",
        example: "🧠 Think: POPULATION = everyone."
      },

      {
        term: "Sample",
        category: "Basics",
        question: "What is a Sample?",
        definition: "A smaller group taken from the population to study.",
        example: "🧠 Think: SAMPLE = some people."
      },

      {
        term: "Census",
        category: "Basics",
        question: "What is a Census?",
        definition: "Collecting data from every member of the population.",
        example: "🧠 Think: CENSUS = everyone is counted."
      },

      {
        term: "Parameter",
        category: "Basics",
        question: "What is a Parameter?",
        definition: "A number that describes a population.",
        example: "🧠 Think: PARAMETER = population number."
      },

      {
        term: "Statistic",
        category: "Basics",
        question: "What is a Statistic?",
        definition: "A number that describes a sample.",
        example: "🧠 Think: STATISTIC = sample number."
      },


      // =========================
      // TYPES OF STATISTICS
      // =========================

      {
        term: "Descriptive Statistics",
        category: "Statistics",
        question: "What are Descriptive Statistics?",
        definition: "Statistics used to describe and summarize the data you collected.",
        example: "🧠 Think: DESCRIBE = summarize what you see."
      },

      {
        term: "Inferential Statistics",
        category: "Statistics",
        question: "What are Inferential Statistics?",
        definition: "Using a sample to make a conclusion about a larger population.",
        example: "🧠 Think: INFER = make a conclusion."
      },

      {
        term: "Numerical Measure",
        category: "Statistics",
        question: "What is a Numerical Measure?",
        definition: "A number used to summarize data, such as the mean or median.",
        example: "🧠 Think: NUMBER = summarizes data."
      },

      {
        term: "Quantitative Model",
        category: "Statistics",
        question: "What is a Quantitative Model?",
        definition: "A mathematical equation used to represent or predict data.",
        example: "🧠 Think: MODEL = math that represents reality."
      },


      // =========================
      // SAMPLING METHODS
      // =========================

      {
        term: "Simple Random Sample",
        category: "Sampling",
        question: "What is a Simple Random Sample?",
        definition: "Every member of the population has an equal chance of being selected.",
        example: "🧠 Think: RANDOM = everyone has an equal chance."
      },

      {
        term: "Stratified Sample",
        category: "Sampling",
        question: "What is a Stratified Sample?",
        definition: "Divide the population into groups, then randomly choose people from each group.",
        example: "🧠 Think: STRATA = split into groups, then sample each group."
      },

      {
        term: "Cluster Sample",
        category: "Sampling",
        question: "What is a Cluster Sample?",
        definition: "Divide the population into groups, randomly choose some groups, and survey everyone in those groups.",
        example: "🧠 Think: CLUSTER = choose whole groups."
      },


      // =========================
      // VARIABLES
      // =========================

      {
        term: "Categorical Variable",
        category: "Variables",
        question: "What is a Categorical Variable?",
        definition: "A variable that places data into groups or categories.",
        example: "Example: Grade level, eye color, or favorite sport. 🧠 CATEGORY = group."
      },

      {
        term: "Numerical Variable",
        category: "Variables",
        question: "What is a Numerical Variable?",
        definition: "A variable that uses numbers to represent a measurable or countable amount.",
        example: "Example: 2.5 hours, 17 students, or 72 inches. 🧠 NUMBER = amount."
      },


      // =========================
      // DATA
      // =========================

      {
        term: "Quantitative Data",
        category: "Data",
        question: "What is Quantitative Data?",
        definition: "Data that can be counted or measured with numbers.",
        example: "🧠 Think: QUANTITY = amount."
      },

      {
        term: "Qualitative Data",
        category: "Data",
        question: "What is Qualitative Data?",
        definition: "Data that describes qualities or categories rather than numerical amounts.",
        example: "🧠 Think: QUALITY = description."
      },


      // =========================
      // LEVELS OF MEASUREMENT
      // =========================

      {
        term: "Nominal Data",
        category: "Data Types",
        question: "What is Nominal Data?",
        definition: "Data placed into categories with no particular order.",
        example: "Example: Eye color or type of car. 🧠 NOMINAL = names."
      },

      {
        term: "Ordinal Data",
        category: "Data Types",
        question: "What is Ordinal Data?",
        definition: "Data placed into categories that have a meaningful order.",
        example: "Example: Small, medium, and large. 🧠 ORDER = ordinal."
      },

      {
        term: "Interval Data",
        category: "Data Types",
        question: "What is Interval Data?",
        definition: "Numerical data where differences are meaningful, but there is no true zero.",
        example: "Example: Temperature in Celsius. 🧠 INTERVAL = equal intervals, no true zero."
      },

      {
        term: "Ratio Data",
        category: "Data Types",
        question: "What is Ratio Data?",
        definition: "Numerical data with equal intervals and a true zero.",
        example: "Example: Height, weight, or age. 🧠 RATIO = interval + true zero."
      },


      // =========================
      // TYPES OF DATA COLLECTION
      // =========================

      {
        term: "Time Series",
        category: "Data Types",
        question: "What is Time Series Data?",
        definition: "Data collected on the same variable over different points in time.",
        example: "Example: Daily temperature for a month. 🧠 TIME = over time."
      },

      {
        term: "Cross-Sectional",
        category: "Data Types",
        question: "What is Cross-Sectional Data?",
        definition: "Data collected from many subjects at one point in time.",
        example: "Example: Surveying 500 students about their favorite sport. 🧠 CROSS-SECTION = many people at once."
      },


      // =========================
      // FREQUENCY & VARIATION
      // =========================

      {
        term: "Variation",
        category: "Frequency",
        question: "What is Variation?",
        definition: "How much the values in a dataset differ or spread out.",
        example: "Example: A dataset ranging from 70 to 90 has variation. 🧠 VARIATION = how spread out."
      },

      {
        term: "Frequency",
        category: "Frequency",
        question: "What is Frequency?",
        definition: "The number of times something occurs.",
        example: "Example: If a value appears 5 times, its frequency is 5. 🧠 FREQUENCY = how often."
      },

      {
        term: "Relative Frequency",
        category: "Frequency",
        question: "What is Relative Frequency?",
        definition: "The proportion or percentage of times something occurs.",
        example: "Example: If 20 out of 100 students choose soccer, the relative frequency is 20%. 🧠 RELATIVE FREQUENCY = how often out of the total."
      }

    ];


    /* ELEMENTS */

    const card = document.getElementById("card");

    const qText =
      document.getElementById("question-text");

    const ordinalLabel =
      document.getElementById("ordinal-label");

    const termName =
      document.getElementById("term-name");

    const termCategory =
      document.getElementById("term-category");

    const termDefinition =
      document.getElementById("term-definition");

    const termExample =
      document.getElementById("term-example");

    const counterEl =
      document.getElementById("counter");

    const prevBtn =
      document.getElementById("prev-btn");

    const nextBtn =
      document.getElementById("next-btn");

    const shuffleBtn =
      document.getElementById("shuffle-btn");


    /* QUIZ STATE */

    let index = 0;

    let showingAnswer = false;


    /* RENDER CARD */

    function renderCard(){

      const item = statistics[index];

      qText.textContent =
        item.question;

      ordinalLabel.textContent =
        "Card " +
        (index + 1) +
        " of " +
        statistics.length;

      termName.textContent =
        item.term;

      termCategory.textContent =
        item.category;

      termDefinition.textContent =
        item.definition;

      termExample.textContent =
        item.example;

      counterEl.textContent =
        "Card " +
        (index + 1) +
        " / " +
        statistics.length;


      /* Always return to question side */

      showingAnswer = false;

      card.classList.remove("show-answer");

    }


    /* NEXT */

    function showNext(){

      index =
        (index + 1) %
        statistics.length;

      renderCard();

    }


    /* PREVIOUS */

    function showPrev(){

      index =
        (index - 1 + statistics.length) %
        statistics.length;

      renderCard();

    }


    /* SHUFFLE */

    function shuffleCard(){

      let newIndex = index;

      while(
        newIndex === index &&
        statistics.length > 1
      ){

        newIndex =
          Math.floor(
            Math.random() *
            statistics.length
          );

      }

      index = newIndex;

      renderCard();

    }


    /* FLIP CARD */

    card.addEventListener("click", () => {

      showingAnswer =
        !showingAnswer;

      if(showingAnswer){

        card.classList.add(
          "show-answer"
        );

      }else{

        card.classList.remove(
          "show-answer"
        );

      }

    });


    /* BUTTONS */

    nextBtn.addEventListener(
      "click",
      e => {

        e.stopPropagation();

        showNext();

      }
    );


    prevBtn.addEventListener(
      "click",
      e => {

        e.stopPropagation();

        showPrev();

      }
    );


    shuffleBtn.addEventListener(
      "click",
      e => {

        e.stopPropagation();

        shuffleCard();

      }
    );


    /* START QUIZ */

    renderCard();

  </script>

</body>
</html>
